name: Publish

# Publishes the package to npm when a GitHub release is published. The job needs the
# repository secret NPM (an npm granular access token with read and write access and
# Bypass 2FA). Without it, the job fails in its first step and publishes nothing.
#
# The release's tag must name package.json's version (scripts/publish-version-guard.mjs).
# A version that is already on npm is skipped, so re-running the job is safe.
# workflow_dispatch runs the same job for an existing tag, for a re-run. The tag must hold
# scripts/publish-version-guard.mjs, so v0.4.1 is the first tag it can take.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.4.0"
        required: true

# contents: read checks out the tagged commit. id-token: write lets npm ask
# Sigstore for a provenance statement (this repository is public).
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the NPM secret
        env:
          NPM_TOKEN: ${{ secrets.NPM }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM secret missing::The repository secret NPM is empty or not set. Add an npm granular access token (read and write, Bypass 2FA) as the secret NPM, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Refuse a release whose tag is not package.json's version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/publish-version-guard.mjs "$TAG"

      - name: Skip when this version is already on npm
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if out=$(npm view "$name@$version" version 2>"$RUNNER_TEMP/err.txt"); then
            if [ "$out" = "$version" ]; then
              echo "$name@$version is already on npm. Nothing to publish."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if grep -q "E404" "$RUNNER_TEMP/err.txt"; then
            echo "$name@$version is not on npm yet. Publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::npm view failed for $name@$version with an error that is not E404:"
          cat "$RUNNER_TEMP/err.txt"
          exit 1

      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        run: bun install --frozen-lockfile
      - name: Test
        if: steps.registry.outputs.published != 'true'
        run: bun run test

      # npm runs prepublishOnly (typecheck and build) before it packs.
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
